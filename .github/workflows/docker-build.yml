name: Docker Build and Push

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)) && secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKER_USERNAME && format('docker.io/{0}/audiarr', secrets.DOCKER_USERNAME) || '' }}
          tags: |
            # Branch-specific tags
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'develop') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main') }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main') }}
            
            # Version tags (only on version tags)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            
            # SHA-based tags for traceability
            type=sha,prefix=develop-,enable=${{ github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'develop') }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main') }}
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-,enable=${{ github.event_name == 'pull_request' && !github.event.pull_request.merged }}
            
            # Merged PR tag
            type=raw,value=pr-${{ github.event.pull_request.number }}-merged,enable=${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
            
            # Date-based tag for edge builds
            type=raw,value=edge-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'develop') }}
            
            # PR tags (for build verification only, not pushed)
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Audiarr
            org.opencontainers.image.description=Self-hosted music streaming server
            org.opencontainers.image.vendor=Audiarr
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.branch=${{ github.ref_name }}
            org.opencontainers.image.build.environment=${{ github.ref == 'refs/heads/develop' && 'development' || 'production' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ github.sha }}
            BRANCH=${{ github.ref_name }}
            BUILD_ENV=${{ github.ref == 'refs/heads/develop' && 'development' || 'production' }}

      - name: Generate SBOM
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/develop' && 'edge' || github.ref == 'refs/heads/main' && 'latest' || steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json

      - name: Comment on PR with build info
        if: github.event_name == 'pull_request' && !github.event.pull_request.merged
        uses: actions/github-script@v7
        with:
          script: |
            const tags = `${{ steps.meta.outputs.tags }}`.split('\n').filter(t => t).join('\n• ');
            const body = `## 🐳 Docker Build Successful!
            
            **Build Details:**
            • SHA: \`${{ github.sha }}\`
            • Platforms: \`linux/amd64, linux/arm64\`
            
            **Image Tags (not pushed for PRs):**
            • ${tags}
            
            To test this build locally after merge:
            \`\`\`bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
            \`\`\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Comment on merged PR with published images
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ github.base_ref }}';
            const prNumber = '${{ github.event.pull_request.number }}';
            const sha = '${{ github.sha }}';
            const registry = '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}';
            
            let mainTag = branch === 'main' ? 'latest' : 'edge';
            
            const body = `## 🚀 Docker Images Published!
            
            This PR has been merged and Docker images have been published to GitHub Container Registry.
            
            **Pull the new images:**
            \`\`\`bash
            # Latest ${branch} build
            docker pull ${registry}:${mainTag}
            
            # Specific PR merge
            docker pull ${registry}:pr-${prNumber}-merged
            
            # SHA-based tag
            docker pull ${registry}:${branch}-${sha.substring(0, 7)}
            \`\`\`
            
            **Image Details:**
            • Registry: \`${registry}\`
            • Branch: \`${branch}\`
            • SHA: \`${sha}\`
            • Platforms: \`linux/amd64, linux/arm64\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  test-image:
    needs: build-and-push
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine test tag
        id: test-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tag=edge" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Test Docker image
        run: |
          docker run --rm \
            -e ASPNETCORE_ENVIRONMENT=Development \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.test-tag.outputs.tag }} \
            --version || true

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.test-tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Create release notes for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const existingRelease = releases.find(r => r.tag_name === tag);
            if (!existingRelease) {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Release ${tag}`,
                body: `## Docker Images
                
                ### GitHub Container Registry
                \`\`\`bash
                docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag.replace('v', '')}
                docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                \`\`\`
                
                ### Docker Hub
                \`\`\`bash
                docker pull ${{ secrets.DOCKER_USERNAME }}/audiarr:${tag.replace('v', '')}
                docker pull ${{ secrets.DOCKER_USERNAME }}/audiarr:latest
                \`\`\`
                
                ### What's Changed
                See commit history for changes.`,
                draft: false,
                prerelease: tag.includes('-')
              });
            }